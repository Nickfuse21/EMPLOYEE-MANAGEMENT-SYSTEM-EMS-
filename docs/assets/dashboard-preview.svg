<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dashboard UI preview">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ind" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06b6d4"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#4f46e5"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#page)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="44" fill="#111827"/>
  <circle cx="26" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="22" r="6" fill="#22c55e"/>
  <rect x="470" y="12" width="260" height="20" rx="10" fill="#1f2937"/>
  <text x="600" y="26" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#94a3b8">ems.app / dashboard</text>

  <!-- sidebar -->
  <rect x="0" y="44" width="240" height="676" fill="#0d1424"/>
  <g transform="translate(24,74)">
    <rect width="34" height="34" rx="10" fill="url(#ind)"/>
    <text x="48" y="23" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#e2e8f0">EMS</text>
  </g>
  <g font-family="Segoe UI, Arial" font-size="14" fill="#94a3b8">
    <rect x="16" y="140" width="208" height="42" rx="10" fill="#6366f1" fill-opacity="0.18"/>
    <rect x="16" y="146" width="4" height="30" rx="2" fill="#818cf8"/>
    <text x="52" y="167" fill="#c7d2fe" font-weight="600">Dashboard</text>
    <text x="52" y="215" >Employees</text>
    <text x="52" y="259">Organization</text>
    <text x="52" y="303">My Team</text>
    <text x="52" y="347">Profile</text>
    <g transform="translate(28,144)" fill="none" stroke="#818cf8" stroke-width="1.8"><rect x="0" y="0" width="7" height="7" rx="1"/><rect x="10" y="0" width="7" height="7" rx="1"/><rect x="0" y="10" width="7" height="7" rx="1"/><rect x="10" y="10" width="7" height="7" rx="1"/></g>
  </g>
  <g transform="translate(16,660)"><rect width="208" height="44" rx="10" fill="#111a2e"/><circle cx="30" cy="22" r="14" fill="url(#cyn)"/><text x="30" y="27" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#08131f">AR</text><text x="54" y="19" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e2e8f0">Admin Root</text><text x="54" y="35" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">Super Admin</text></g>

  <!-- header -->
  <text x="272" y="92" font-family="Segoe UI, Arial" font-size="26" font-weight="800" fill="#f1f5f9">Dashboard</text>
  <text x="272" y="116" font-family="Segoe UI, Arial" font-size="13" fill="#64748b">Welcome back — here's what's happening across your organisation.</text>
  <g transform="translate(1000,72)"><rect width="176" height="40" rx="12" fill="url(#ind)"/><text x="88" y="26" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#fff">+ Add Employee</text></g>

  <!-- stat cards -->
  <g font-family="Segoe UI, Arial">
    <!-- total -->
    <g transform="translate(272,140)">
      <rect width="216" height="118" rx="16" fill="#111a2e" stroke="#1e293b"/>
      <rect x="20" y="22" width="40" height="40" rx="12" fill="url(#ind)"/>
      <text x="20" y="92" font-size="34" font-weight="800" fill="#f8fafc">248</text>
      <text x="86" y="42" font-size="12" fill="#94a3b8">Total Employees</text>
      <text x="86" y="60" font-size="11" fill="#34d399">&#9650; 12% this quarter</text>
    </g>
    <!-- active -->
    <g transform="translate(504,140)">
      <rect width="216" height="118" rx="16" fill="#111a2e" stroke="#1e293b"/>
      <rect x="20" y="22" width="40" height="40" rx="12" fill="url(#grn)"/>
      <text x="20" y="92" font-size="34" font-weight="800" fill="#f8fafc">231</text>
      <text x="86" y="42" font-size="12" fill="#94a3b8">Active</text>
      <text x="86" y="60" font-size="11" fill="#34d399">93% of workforce</text>
    </g>
    <!-- inactive -->
    <g transform="translate(736,140)">
      <rect width="216" height="118" rx="16" fill="#111a2e" stroke="#1e293b"/>
      <rect x="20" y="22" width="40" height="40" rx="12" fill="url(#amb)"/>
      <text x="20" y="92" font-size="34" font-weight="800" fill="#f8fafc">17</text>
      <text x="86" y="42" font-size="12" fill="#94a3b8">Inactive</text>
      <text x="86" y="60" font-size="11" fill="#94a3b8">On leave / exited</text>
    </g>
    <!-- departments -->
    <g transform="translate(968,140)">
      <rect width="208" height="118" rx="16" fill="#111a2e" stroke="#1e293b"/>
      <rect x="20" y="22" width="40" height="40" rx="12" fill="url(#cyn)"/>
      <text x="20" y="92" font-size="34" font-weight="800" fill="#f8fafc">9</text>
      <text x="86" y="42" font-size="12" fill="#94a3b8">Departments</text>
      <text x="86" y="60" font-size="11" fill="#94a3b8">Across 3 offices</text>
    </g>
  </g>

  <!-- bar chart: by department -->
  <g transform="translate(272,286)" font-family="Segoe UI, Arial">
    <rect width="560" height="410" rx="16" fill="#111a2e" stroke="#1e293b"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#e2e8f0">Employees by Department</text>
    <g stroke="#1e293b"><path d="M24 90 H536 M24 160 H536 M24 230 H536 M24 300 H536"/></g>
    <g>
      <rect x="60"  y="130" width="46" height="200" rx="6" fill="url(#bar)"/>
      <rect x="140" y="170" width="46" height="160" rx="6" fill="url(#bar)"/>
      <rect x="220" y="110" width="46" height="220" rx="6" fill="url(#bar)"/>
      <rect x="300" y="200" width="46" height="130" rx="6" fill="url(#bar)"/>
      <rect x="380" y="150" width="46" height="180" rx="6" fill="url(#bar)"/>
      <rect x="460" y="230" width="46" height="100" rx="6" fill="url(#bar)"/>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="83" y="352">Eng</text>
      <text x="163" y="352">Sales</text>
      <text x="243" y="352">Ops</text>
      <text x="323" y="352">HR</text>
      <text x="403" y="352">Fin</text>
      <text x="483" y="352">Mktg</text>
    </g>
  </g>

  <!-- donut: by role -->
  <g transform="translate(856,286)" font-family="Segoe UI, Arial">
    <rect width="320" height="410" rx="16" fill="#111a2e" stroke="#1e293b"/>
    <text x="24" y="40" font-size="15" font-weight="700" fill="#e2e8f0">Headcount by Role</text>
    <g transform="translate(160,180)" fill="none" stroke-width="34">
      <circle r="70" stroke="#1e293b"/>
      <circle r="70" stroke="url(#ind)" stroke-dasharray="264 440" transform="rotate(-90)"/>
      <circle r="70" stroke="url(#grn)" stroke-dasharray="110 440" stroke-dashoffset="-264" transform="rotate(-90)"/>
      <circle r="70" stroke="url(#amb)" stroke-dasharray="66 440" stroke-dashoffset="-374" transform="rotate(-90)"/>
    </g>
    <text x="160" y="176" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">248</text>
    <text x="160" y="196" text-anchor="middle" font-size="11" fill="#64748b">people</text>
    <g font-size="12" fill="#cbd5e1" transform="translate(28,300)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#6366f1"/><text x="20" y="11">Employee &#183; 60%</text>
      <rect x="0" y="26" width="12" height="12" rx="3" fill="#10b981"/><text x="20" y="37">HR Manager &#183; 25%</text>
      <rect x="0" y="52" width="12" height="12" rx="3" fill="#f59e0b"/><text x="20" y="63">Super Admin &#183; 15%</text>
    </g>
  </g>
</svg>

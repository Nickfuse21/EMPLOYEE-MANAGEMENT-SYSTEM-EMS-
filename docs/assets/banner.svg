<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Employee Management System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="60" r="240" fill="url(#glow)"/>
  <circle cx="180" cy="300" r="200" fill="url(#glow)" opacity="0.7"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 85 H1200 M0 170 H1200 M0 255 H1200"/>
    <path d="M200 0 V340 M400 0 V340 M600 0 V340 M800 0 V340 M1000 0 V340"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#accent)" filter="url(#soft)" opacity="0.35"/>
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#accent)"/>
    <g fill="#0f172a">
      <circle cx="60" cy="42" r="18"/>
      <path d="M28 96 c0-18 14-30 32-30 s32 12 32 30 z"/>
      <circle cx="26" cy="52" r="11" opacity="0.75"/>
      <circle cx="94" cy="52" r="11" opacity="0.75"/>
    </g>
  </g>

  <!-- title -->
  <text x="240" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Employee Management System</text>
  <text x="242" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#a5b4fc">Full-stack workforce platform &#183; Auth &#183; RBAC &#183; Org Hierarchy &#183; Analytics</text>

  <!-- stack chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(242,232)">
      <rect width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="44" y="22" text-anchor="middle" fill="#c7d2fe">React 18</text>
    </g>
    <g transform="translate(342,232)">
      <rect width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="55" y="22" text-anchor="middle" fill="#c7d2fe">TypeScript</text>
    </g>
    <g transform="translate(464,232)">
      <rect width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="56" y="22" text-anchor="middle" fill="#c7d2fe">Node &#183; Express</text>
    </g>
    <g transform="translate(588,232)">
      <rect width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="48" y="22" text-anchor="middle" fill="#c7d2fe">MongoDB</text>
    </g>
    <g transform="translate(696,232)">
      <rect width="64" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="32" y="22" text-anchor="middle" fill="#c7d2fe">JWT</text>
    </g>
    <g transform="translate(772,232)">
      <rect width="80" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="40" y="22" text-anchor="middle" fill="#c7d2fe">Docker</text>
    </g>
  </g>
</svg>

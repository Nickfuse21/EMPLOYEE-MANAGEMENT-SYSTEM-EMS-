# nginx config for serving the React SPA and proxying API calls to the backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API requests to the backend service (see docker-compose).
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Client-side routing: serve index.html for any unmatched path.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
